name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node 26.4
        uses: actions/setup-node@v5
        with:
          node-version: "26.4.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Extension integration tests
        # xvfb-run provides the display VS Code needs on Linux.
        run: xvfb-run --auto-servernum npm run test:e2e

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node 26.4
        uses: actions/setup-node@v5
        with:
          node-version: "26.4.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package VSIX
        run: npx vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: comment-doc-links-vsix
          path: "*.vsix"
          if-no-files-found: error
