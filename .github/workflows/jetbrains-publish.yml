name: Publish JetBrains Plugin

# Separate from VS Code Marketplace / Open VSX publishing. This is a DELIBERATE,
# manual job only — it never fires automatically on a VS Code release, so the
# existing VS Code Marketplace / Open VSX publishing pipelines are completely
# decoupled and unaffected. Run it from the Actions tab (with a release tag) once
# the JetBrains Marketplace secrets are configured.
on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Tag to publish (e.g. v0.1.3)
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Build, sign and publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Publish may only run from a tag (got ref_type=${{ github.ref_type }})."
            exit 1
          fi
          if [[ "${{ github.ref_name }}" != v* ]]; then
            echo "Release tag must start with 'v' (got ${{ github.ref_name }})."
            exit 1
          fi
          if [ "${{ github.ref_name }}" != "${{ inputs.release_ref }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match release_ref input ${{ inputs.release_ref }}."
            exit 1
          fi

      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: jetbrains
        run: chmod +x ./gradlew

      - name: Build, sign and publish
        working-directory: jetbrains
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          JETBRAINS_MARKETPLACE_CHANNELS: ${{ secrets.JETBRAINS_MARKETPLACE_CHANNELS }}
          JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: ./gradlew buildPlugin publishPlugin
