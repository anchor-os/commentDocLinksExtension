name: Publish JetBrains Plugin

# Separate from VS Code Marketplace / Open VSX publishing. This is a DELIBERATE,
# manual job only — it never fires automatically on a VS Code release, so the
# existing VS Code Marketplace / Open VSX publishing pipelines are completely
# decoupled and unaffected. Run it from the Actions tab (with a release tag) once
# the JetBrains Marketplace secrets are configured.
on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Tag to publish (e.g. v0.1.3)
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Build, sign and publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    # Secrets are stored as ENVIRONMENT secrets (not repository secrets), so the
    # job must reference the environment for `secrets.JETBRAINS_MARKETPLACE_TOKEN`
    # to resolve.
    environment: marketplace-publish
    steps:
      - name: Validate release ref (manual dispatch)
        # Mirrors `.github/workflows/publish-openvsx.yml`: manual runs may be
        # dispatched from any branch (e.g. main); the actual published content is
        # the fully-qualified tag refs/tags/<release_ref>, so a same-named branch
        # can never shadow the intended release.
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_ref must be a version tag (e.g. v0.1.3), got '${RELEASE_REF}'."
            exit 1
          fi
          # Query the remote directly: this step runs before actions/checkout,
          # so no `origin` remote is configured yet. GITHUB_REPOSITORY is
          # auto-provided by Actions; the token authenticates the request.
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git ls-remote --exit-code --tags "$REPO_URL" "refs/tags/${RELEASE_REF}" >/dev/null 2>&1; then
            echo "::error::Tag '${RELEASE_REF}' does not exist on the origin remote."
            exit 1
          fi
          echo "release_ref '${RELEASE_REF}' is a valid version tag."

      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_ref }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: jetbrains
        run: chmod +x ./gradlew

      - name: Build, sign and publish
        working-directory: jetbrains
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          JETBRAINS_MARKETPLACE_CHANNELS: ${{ secrets.JETBRAINS_MARKETPLACE_CHANNELS }}
          JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: ./gradlew buildPlugin publishPlugin
