name: Publish to VS Code Marketplace

on:
  release:
    types: [published]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 26.4
        uses: actions/setup-node@v4
        with:
          node-version: "26.4.0"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Extension integration tests
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Verify release tag matches package version
        run: |
          version="$(node --input-type=commonjs -e "console.log(require('./package.json').version)")"
          expected="v${version}"
          actual="${GITHUB_REF_NAME}"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::Release tag '${actual}' does not match package.json version '${version}' (expected '${expected}')."
            exit 1
          fi
          echo "Release tag '${actual}' matches package.json version '${version}'."

      - name: Package VSIX
        run: npm run package -- --no-dependencies -o extension.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: comment-doc-links-vsix
          path: extension.vsix
          if-no-files-found: error

  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node 26.4
        uses: actions/setup-node@v4
        with:
          node-version: "26.4.0"

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: comment-doc-links-vsix

      - name: Publish to VS Code Marketplace (OIDC trusted publishing)
        # OIDC trusted publishing exchanges the GitHub Actions OIDC token for a
        # short-lived Marketplace credential. No PAT or secret is required.
        # Pinned to the exact version that ships --oidc (not on latest yet).
        run: npx --yes @vscode/vsce@3.9.3-4 publish --oidc --packagePath extension.vsix
